<text class="sub" x="36" y="135">only the tools the job needs,</text>
<text class="sub" x="36" y="151">no standing keys</text>
<rect class="box" x="20" y="192" width="280" height="52" rx="2"/>
<text class="lbl lbl-strong" x="36" y="213">2  Reach</text>
<text class="sub" x="36" y="231">other machines are reachable</text>
