<text class="sub" x="36" y="299">model servers on their own</text>
<text class="sub" x="36" y="315">subnet, no open egress</text>
<rect class="box" x="20" y="356" width="280" height="52" rx="2"/>
<text class="lbl lbl-strong" x="36" y="377">3  Copy</text>
<text class="sub" x="36" y="395">model files move to a new host</text>
<line class="ln" x1="160" y1="408" x2="160" y2="424" marker-end="url(#f07n-m)"/>
<rect class="box" x="20" y="424" width="280" height="68" rx="2"/>
<text class="lbl lbl-strong" x="36" y="445">Watch transfers</text>
<text class="sub" x="36" y="463">alert on multi-GB model files</text>
<text class="sub" x="36" y="479">moving between hosts</text>
<rect class="box" x="20" y="520" width="280" height="52" rx="2"/>
<text class="lbl lbl-strong" x="36" y="541">4  Run and stay</text>
<text class="sub" x="36" y="559">the copy starts and stays running</text>
<line class="ln" x1="160" y1="572" x2="160" y2="588" marker-end="url(#f07n-m)"/>
<rect class="box-accent" x="20" y="588" width="280" height="68" rx="2"/>
<text class="lbl lbl-strong" x="36" y="609">A person starts every rollout</text>
<text class="sub" x="36" y="627">nothing else is</text>
<text class="sub" x="36" y="643">allowed to run</text>
</svg>
