<svg class="wv sw" viewBox="0 0 760 360" role="img" aria-labelledby="f02w-t f02w-d" xmlns="http://www.w3.org/2000/svg">
<title id="f02w-t">Five models on five cards, all inside the network</title>
<desc id="f02w-d">People use LibreChat as the main chat front end and pick a model there. Each model has a card of its own. The chat, vision and embedding models sit behind one local router on a single address, which passes each request to the card that serves the model it names: Qwen3.6-35B for chat and coding at about 24 tokens per second, Qwen3.5-4B for fast answers, the same Qwen3.5-4B with an image encoder for images and screenshots, and Qwen3-Embedding-0.6B for documents and search. The Wan 2.1 video model, for short clips, is not behind the router: it is connected as an MCP tool that the chosen model can call. Everything sits inside the company network on older 6 and 8 GB cards. Nothing leaves.</desc>
<defs><marker id="f02w-m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path class="arrow" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="frame" x="4" y="4" width="752" height="320" rx="4"/>
<text class="lbl-mono" x="20" y="27">Company network · older 6 and 8 GB cards</text>
<rect class="box" x="20" y="124" width="100" height="56" rx="2"/>
<text class="lbl" x="70" y="157" text-anchor="middle">People</text>
<line class="ln" x1="120" y1="152" x2="150" y2="152" marker-end="url(#f02w-m)"/>
<rect class="box" x="150" y="124" width="120" height="56" rx="2"/>
<text class="lbl" x="210" y="147" text-anchor="middle">LibreChat</text>
<text class="sub" x="210" y="166" text-anchor="middle">pick a model</text>
<line class="ln" x1="270" y1="152" x2="300" y2="152" marker-end="url(#f02w-m)"/>
<rect class="box-accent" x="300" y="124" width="150" height="56" rx="2"/>
<text class="lbl lbl-strong" x="316" y="147">Local router</text>
<text class="sub" x="316" y="166">one address</text>
<line class="ln" x1="450" y1="152" x2="480" y2="152"/>
<line class="ln" x1="480" y1="71" x2="480" y2="233"/>
<line class="ln" x1="480" y1="71" x2="520" y2="71" marker-end="url(#f02w-m)"/>
<line class="ln" x1="480" y1="125" x2="520" y2="125" marker-end="url(#f02w-m)"/>
<line class="ln" x1="480" y1="179" x2="520" y2="179" marker-end="url(#f02w-m)"/>
<line class="ln" x1="480" y1="233" x2="520" y2="233" marker-end="url(#f02w-m)"/>
<line class="ln" x1="210" y1="180" x2="210" y2="287" stroke-dasharray="4 4"/>
<line class="ln" x1="210" y1="287" x2="520" y2="287" stroke-dasharray="4 4" marker-end="url(#f02w-m)"/>
<rect class="box" x="520" y="48" width="220" height="46" rx="2"/>
<text class="lbl" x="536" y="68">Qwen3.6-35B (MoE)</text>
<text class="sub" x="536" y="85">chat and coding, ~24 tok/s</text>
<rect class="box" x="520" y="102" width="220" height="46" rx="2"/>
<text class="lbl" x="536" y="122">Qwen3.5-4B</text>
<text class="sub" x="536" y="139">fast answers</text>
<rect class="box" x="520" y="156" width="220" height="46" rx="2"/>
<text class="lbl" x="536" y="176">Qwen3.5-4B + vision</text>
<text class="sub" x="536" y="193">images and screenshots</text>
<rect class="box" x="520" y="210" width="220" height="46" rx="2"/>
<text class="lbl" x="536" y="230">Qwen3-Embedding-0.6B</text>
<text class="sub" x="536" y="247">documents and search</text>
<rect class="box" x="520" y="264" width="220" height="46" rx="2"/>
<text class="lbl" x="536" y="284">Wan 2.1 video · MCP tool</text>
<text class="sub" x="536" y="301">called by the chosen model</text>
<text class="lbl-mono acc-raw" x="756" y="348" text-anchor="end">Nothing leaves</text>
<g><line class="ln-accent" x1="633" y1="339" x2="643" y2="349"/><line class="ln-accent" x1="633" y1="349" x2="643" y2="339"/></g>
</svg>
<svg class="nv sw" viewBox="0 0 320 560" role="img" aria-labelledby="f02n-t f02n-d" xmlns="http://www.w3.org/2000/svg">
